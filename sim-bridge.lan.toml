# sim-bridge — LAN config (optional)
# Both PCs on the same network through a router or switch.
#
# This file is OPTIONAL. sim-bridge works without it:
#   sim-bridge.exe source       (gaming PC — multicast, all apps enabled)
#   sim-bridge.exe target       (SimHub PC)
#
# Use this file if you want to persist settings across runs, or if you
# prefer config-file style over CLI flags.
#
# Rename to sim-bridge.toml and place next to sim-bridge.exe.
# CLI flags (in the bat file) override values set here.

mode = "source"

[network]
unicast = false
# source_ip and target_ip are ignored for iRacing and AC (multicast handles those).
# target_ip is used by Sim Relay to forward UDP game data (F1, Forza, BeamNG, etc.).
# Set this to the SimHub PC's IP if you play any Sim Relay games.
source_ip = "192.168.50.1"
target_ip = "192.168.50.2"

[ports]
iracing_teleport = 5000
ac_teleport = 5001

[detection]
scan_interval = 3
drain_seconds = 20

[apps]
iracing_teleport_enabled = true
ac_teleport_enabled = true
sim_relay_enabled = true
high_priority = false
busy_wait = false
fanalab = false

[advanced]
stale_timeout_secs = 10
reconnect_timeout_secs = 10
ac_poll_rate = 60
datagram_size = 9000
