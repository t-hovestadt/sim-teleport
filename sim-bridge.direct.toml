# sim-bridge — Direct Ethernet config (optional)
# Dedicated cable between gaming PC and SimHub PC, no router.
#
# This file is OPTIONAL. You can use CLI flags instead:
#   Gaming PC bat:  sim-bridge.exe source --unicast --target 192.168.50.2 --bind 192.168.50.1
#   SimHub PC bat:  sim-bridge.exe target --unicast --source 192.168.50.1 --high-priority --busy-wait
#
# If you prefer a config file, rename this to sim-bridge.toml, place it next
# to sim-bridge.exe, and edit source_ip / target_ip to match your static IPs.
# CLI flags (in the bat file) override values set here.

mode = "source"

[network]
unicast = true
source_ip = "192.168.50.1"
target_ip = "192.168.50.2"

[ports]
iracing_teleport = 5000
ac_teleport = 5001

[detection]
scan_interval = 3
drain_seconds = 20

[apps]
iracing_teleport_enabled = true
ac_teleport_enabled = true
sim_relay_enabled = true
high_priority = false
busy_wait = false
fanalab = false

[advanced]
stale_timeout_secs = 10
reconnect_timeout_secs = 10
ac_poll_rate = 60
datagram_size = 9000
