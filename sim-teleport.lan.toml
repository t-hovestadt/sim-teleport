# sim-teleport — LAN config (optional)
# Both PCs on the same network through a router or switch.
#
# This file is OPTIONAL. sim-teleport works without it:
#   sim-teleport.exe source       (gaming PC — multicast, all apps enabled)
#   sim-teleport.exe target       (SimHub PC)
#
# Use this file if you want to persist settings across runs, or if you
# prefer config-file style over CLI flags.
#
# Rename to sim-teleport.toml and place next to sim-teleport.exe.
# CLI flags (in the bat file) override values set here.

mode = "source"

[network]
unicast = false
# source_ip and target_ip are ignored for iRacing and AC (multicast handles those).
# target_ip is used by Sim Relay to forward UDP game data (F1, Forza, BeamNG, etc.).
# Set this to the SimHub PC's IP if you play any Sim Relay games.
source_ip = "192.168.50.1"
target_ip = "192.168.50.2"

[ports]
iracing_teleport = 5000
ac_teleport = 5001

[detection]
scan_interval = 3
drain_seconds = 20

[apps]
iracing_teleport_enabled = true
ac_teleport_enabled = true
sim_relay_enabled = true
high_priority = false
busy_wait = false
fanalab = false
# Write iRacing .ibt telemetry files on the target PC (for disk-based tools like Garage 61)
write_ibt = false
# Port offset for Sim Relay: target listens on (game_port+offset), SimHub reads game_port.
# Avoids binding conflict between sim-relay and SimHub on the target PC. Default 10000.
relay_port_offset = 10000

[advanced]
stale_timeout_secs = 10
reconnect_timeout_secs = 10
ac_poll_rate = 60
datagram_size = 9000

[simhub]
# Automatically switch SimHub to the correct game when telemetry arrives.
# Full path to SimHubWPF.exe (leave commented for default install location).
# path = "C:/Program Files (x86)/SimHub/SimHubWPF.exe"
# SimHub game codes — change only if SimHub uses a different string for your setup.
iracing = "iRacing"
ac = "AssettoCorsa"
# ac_evo = "AssettoCorsaEVO"          # SimHub code for AC EVO (default: AssettoCorsaEVO)
# acc    = "AssettoCorsaCompetizione" # SimHub code for ACC   (default: AssettoCorsaCompetizione)
