name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Asset
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sim-teleport.exe release/
          Copy-Item start-source.bat release/
          Copy-Item start-target.bat release/
          Copy-Item sim-teleport.lan.toml release/
          Copy-Item sim-teleport.direct.toml release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/sim-teleport.exe
            release/start-source.bat
            release/start-target.bat
            release/sim-teleport.lan.toml
            release/sim-teleport.direct.toml
          generate_release_notes: true
