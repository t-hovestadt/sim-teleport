name: Release

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-gnu/release/sim-bridge.exe release/
          cp start-source.bat release/
          cp start-target.bat release/
          cp README.md release/

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/sim-bridge.exe
            release/start-source.bat
            release/start-target.bat
            release/README.md
