[package]
name = "sim-relay"
version = "0.1.1"
edition = "2021"
description = "Forward game telemetry UDP to a remote SimHub PC"
license = "MIT"
repository = "https://github.com/t-hovestadt/sim-relay"
keywords = ["sim-racing", "simhub", "telemetry", "udp"]

[[bin]]
name = "sim-relay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
