[package]
name = "sim-bridge"
version = "0.1.5"
edition = "2021"
description = "Unified launcher for iRacing Teleport, AC Teleport, and Sim Relay"

[[bin]]
name = "sim-bridge"
path = "src/main.rs"

[dependencies]
teleport    = { path = "deps/iracing-teleport/teleport" }
ac-teleport = { path = "deps/ac-teleport" }
sim-relay   = { path = "deps/sim-relay" }
clap        = { version = "4", features = ["derive"] }
ctrlc       = "3"
toml        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = "0.4"
anyhow      = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
