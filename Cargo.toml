[package]
name = "ac-teleport"
version = "0.3.0"
edition = "2021"
description = "Stream Assetto Corsa / AC EVO telemetry to a remote SimHub PC"

[[bin]]
name = "ac-teleport"
path = "src/main.rs"

[[bin]]
name = "source"
path = "src/bin/source.rs"

[[bin]]
name = "target"
path = "src/bin/target.rs"

[lib]
name = "ac_teleport"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "checked-decode"] }
ctrlc = "3"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
