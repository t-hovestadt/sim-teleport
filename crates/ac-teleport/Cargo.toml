[package]
name = "ac-teleport"
version = "0.3.2"
edition = "2021"
description = "Stream Assetto Corsa / AC EVO telemetry to a remote SimHub PC"

[lib]
name = "ac_teleport"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "checked-decode"] }
ctrlc = "3"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }
